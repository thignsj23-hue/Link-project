name: Build LINK Android v0.2

on:
  workflow_dispatch:
  push:
    branches:
      - feature/link-v0.2-complete
    paths:
      - "LINK-Android/**"
      - "LINK-Backend/**"
      - "docs/**"
      - "README.md"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Compile Android debug APK
        working-directory: LINK-Android
        run: gradle --no-daemon assembleDebug

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies and test
        working-directory: LINK-Backend
        run: |
          pip install -r requirements-dev.txt
          python -m compileall -q app
          PYTHONPATH=. pytest -q

      - name: Package APK and source
        run: |
          mkdir -p dist
          cp LINK-Android/app/build/outputs/apk/debug/app-debug.apk dist/app-debug.apk
          zip -r dist/LINK-Android-v0.2.0-source.zip . \
            -x "./.git/*" "./LINK-Android/.gradle/*" "./LINK-Android/app/build/*" "./dist/*" "*/__pycache__/*" "*/.venv/*"

      - name: Upload APK and source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: LINK-v0.2.0-artifacts
          path: |
            dist/app-debug.apk
            dist/LINK-Android-v0.2.0-source.zip
          if-no-files-found: error
          retention-days: 30
